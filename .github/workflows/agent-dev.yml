name: Autonomous Dev Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  develop-and-test:
    if: github.event.label.name == 'agent-ready' && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal agent dependencies
        run: pip install --quiet openai pydantic

      - name: Run Dev Agent + Validation (with auto-retry on 503)
        id: agent
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_FALLBACK_MODELS: ${{ secrets.LLM_FALLBACK_MODELS }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MAX_STEPS: "3"
          MAX_RUN_TOKENS: "60000"
        run: |
          WAIT_TIMES=(60)
          TOTAL_ATTEMPTS=$(( ${#WAIT_TIMES[@]} + 1 ))

          for attempt in $(seq 1 $TOTAL_ATTEMPTS); do
            echo "=== Automated run attempt ${attempt}/${TOTAL_ATTEMPTS} ==="
            set +e
            python .agent/run_agent.py
            EXIT_CODE=$?
            set -e

            if [ "$EXIT_CODE" -eq 0 ]; then
              exit 0
            elif [ "$EXIT_CODE" -eq 2 ] && [ "$attempt" -lt "$TOTAL_ATTEMPTS" ]; then
              SLEEP_SEC=${WAIT_TIMES[$((attempt - 1))]}
              echo "Transient LLM API error (503/timeout). Sleeping ${SLEEP_SEC}s before retry..."
              sleep "$SLEEP_SEC"
            else
              exit "$EXIT_CODE"
            fi
          done

      - name: Create branch and commit code changes
        if: success()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="agent/issue-${ISSUE_NUMBER}"
          git config user.name "agent-dev[bot]"
          git config user.email "agent-dev[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add index.html style.css src tests

          if git diff --cached --quiet; then
            echo "No code changes detected to commit."
            exit 1
          fi

          git commit -m "feat(agent): resolve issue #${ISSUE_NUMBER}"
          echo "AGENT_BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Run Docs Agent (README.md only, fail-soft)
        if: success()
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_FALLBACK_MODELS: ${{ secrets.LLM_FALLBACK_MODELS }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MAX_RUN_TOKENS: "30000"
        run: python .agent/run_docs_agent.py

      - name: Commit README update (if any) and open Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "docs(agent): update README for issue #${ISSUE_NUMBER}"
          fi

          git push -u origin "$AGENT_BRANCH" --force

          PR_TITLE="${AGENT_PR_TITLE:-feat: resolve issue #${ISSUE_NUMBER}}"
          EXISTING_PR=$(gh pr list --head "$AGENT_BRANCH" --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/agent_report.md"
            PR_NUM="$EXISTING_PR"
          else
            gh pr create --base main --head "$AGENT_BRANCH" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/agent_report.md"
            PR_NUM=$(gh pr list --head "$AGENT_BRANCH" --json number --jq '.[0].number')
          fi

          PR_URL=$(gh pr view "$PR_NUM" --json url --jq '.url')
          echo "PR_NUM=${PR_NUM}" >> "$GITHUB_ENV"
          echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"

      - name: Run Reviewer Agent (Read-Only)
        if: success()
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_FALLBACK_MODELS: ${{ secrets.LLM_FALLBACK_MODELS }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python .agent/run_reviewer.py

      - name: Post Review Comment & Notify Human for Merge
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          gh pr comment "$PR_NUM" --body-file "$RUNNER_TEMP/review_report.md"
          gh pr edit "$PR_NUM" --add-reviewer "$ISSUE_AUTHOR"
          gh issue comment "$ISSUE_NUMBER" --body "Dev + Docs + Reviewer agents finished (approved=${REVIEW_APPROVED}). PR ready for @${ISSUE_AUTHOR}: ${PR_URL}"

      - name: Report failure on Issue
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f "$RUNNER_TEMP/agent_report.md" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/agent_report.md"
          else
            gh issue comment "$ISSUE_NUMBER" --body "Agent encountered an error before completing. Check logs: ${RUN_URL}"
          fi